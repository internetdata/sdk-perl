name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - run: cpanm --notest --quiet --installdeps .
      # The tag only TRIGGERS this; PAUSE indexes whatever the tarball says.
      # Without this check, tagging v1.0.1 against a 1.0.0 module uploads 1.0.0
      # again, which PAUSE accepts and then refuses to index.
      - name: Tag must match $InternetData::VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(perl -Ilib -MInternetData -e 'print $InternetData::VERSION')"
          if [ "$tag" != "$version" ] ; then
            echo "tag $tag does not match InternetData::VERSION $version" >&2
            exit 1
          fi
      - run: perl Makefile.PL
      - run: make
      - run: prove -Ilib -Iblib/lib -r t
      # MANIFEST is generated from MANIFEST.SKIP rather than committed, so the
      # reviewable artifact is the exclusion list.
      - run: make manifest
      - run: make dist
      - name: Upload to PAUSE
        env:
          PAUSE_USER: ${{ secrets.PAUSE_USER }}
          PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
        run: |
          cpanm --notest --quiet CPAN::Uploader
          cpan-upload --user "$PAUSE_USER" --password "$PAUSE_PASSWORD" InternetData-*.tar.gz

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if ! grep -q '^### ' notes.md ; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
